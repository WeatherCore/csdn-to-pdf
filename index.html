<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSDN → PDF</title>
</head>
<body>
  <!-- 顶栏：命令栏（转换前）→ 精简条（阅读时），打印时全部隐藏 -->
  <header class="topbar">
    <div class="topbar-home" id="topbar-home">
      <span class="brand">
        <i class="ph ph-file-pdf" aria-hidden="true"></i>
        <span>CSDN <i class="ph ph-arrow-right" aria-hidden="true"></i> PDF</span>
      </span>
      <span class="tagline">只留正文，其他全清</span>
    </div>
    <div class="topbar-reading" id="topbar-reading" hidden>
      <button id="back-btn" class="btn ghost" type="button">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>返回
      </button>
    </div>
  </header>

  <!-- 状态一：空状态（首页） -->
  <main id="home" class="home">
    <div class="hero">
      <h1>把一篇 CSDN 文章<br /><em>读干净</em>，再存成 PDF。</h1>
      <p class="sub">粘贴文章链接，得到只含标题与正文的阅读页，代码块、图片、目录原样保留。</p>
    </div>

    <form id="url-form" class="cmdbar" autocomplete="off">
      <i class="ph ph-link" aria-hidden="true"></i>
      <input id="url-input" type="url" spellcheck="false"
             placeholder="https://blog.csdn.net/…/article/details/…" aria-label="文章链接" />
      <button id="go-btn" type="submit">转换</button>
    </form>
    <p id="status" class="status" role="alert"></p>

    <div class="examples">
      <span>试一试：</span>
      <button type="button" class="example-link"
              data-url="https://blog.csdn.net/aidijava/article/details/130908724">二分查找（C 语言）</button>
      <button type="button" class="example-link"
              data-url="https://blog.csdn.net/iLoyo_/article/details/131491911">二分查找图文详解</button>
    </div>

    <ul class="points">
      <li><i class="ph ph-broom" aria-hidden="true"></i><span><strong>剥掉脚手架</strong>：评论区、侧栏、广告、AI 摘要，一个不留</span></li>
      <li><i class="ph ph-monitor-arrow-up" aria-hidden="true"></i><span><strong>打印排版</strong>：A4 边距，代码块不跨页截断</span></li>
      <li><i class="ph ph-shield-check" aria-hidden="true"></i><span><strong>零存储</strong>：抓完即走，服务端不保存任何内容</span></li>
    </ul>
  </main>

  <!-- 状态二：骨架屏（加载中） -->
  <main id="skeleton" class="reader-skeleton" hidden>
    <div class="skeleton-title sk"></div>
    <div class="sk" style="width: 38%"></div>
    <div class="sk" style="width: 92%"></div>
    <div class="sk" style="width: 86%"></div>
    <div class="sk" style="width: 90%"></div>
    <div class="sk sk-code" style="width: 100%"></div>
    <div class="sk" style="width: 60%"></div>
    <div class="sk sk-img" style="width: 70%"></div>
    <div class="sk" style="width: 88%"></div>
    <div class="sk" style="width: 74%"></div>
  </main>

  <!-- 状态三：阅读页 -->
  <main id="reader" class="reader" hidden>
    <div id="truncation-note" class="truncation-note" hidden>
      <i class="ph ph-warning" aria-hidden="true"></i>
      <span>这篇的完整正文需要 CSDN 登录态，只抓到了开头部分。可在 Worker 配置 CSDN_COOKIE 后重试。</span>
    </div>
    <h1 id="article-title"></h1>
    <article id="article-body"></article>
    <div class="reader-end">
      <button id="print-btn" class="btn print" type="button">
        <i class="ph ph-printer" aria-hidden="true"></i>打印 / 存 PDF
      </button>
      <button id="again-btn" class="btn ghost" type="button">再来一篇</button>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
